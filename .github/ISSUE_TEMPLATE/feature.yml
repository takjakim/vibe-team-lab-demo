name: 기능 요청
description: 섹션 기능 추가나 개선을 요청합니다.
title: "[역할 ?] "
labels: ["type:feature"]
body:
  - type: dropdown
    id: role
    attributes:
      label: 담당 역할
      options:
        - 역할 A (팀 소개)
        - 역할 B (할 일 보드)
        - 역할 C (주간 일정)
        - 역할 D (테마)
        - 역할 E (공지)
        - 공용(강사 확인 필요)
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: 담당 파일
      description: 수정할 파일 경로를 적습니다. 공용 파일은 적지 않습니다.
      placeholder: src/sections/board.js
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 무엇을 왜 바꾸는지 한두 문장으로 적습니다.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 확인할 수 있는 체크 항목으로 적습니다.
      value: |
        - [ ] 
        - [ ] node scripts/check.mjs 통과
    validations:
      required: true
